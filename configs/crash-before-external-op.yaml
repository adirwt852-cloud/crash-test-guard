version: "1.0"

agent:
  command: ["go", "run", "./mock-agent/main.go"]
  protocol: http
  endpoint: "http://localhost:8080"
  startup_timeout: "30s"
  shutdown_timeout: "10s"

crash_scenarios:
  - type: process_kill
    trigger:
      event: external_call_start
      step_id: process_payment
      timing: before_event
    fallback:
      timeout: 30s
      on_missed: fail

verification:
  checkpoint_consistency: true
  duplicate_side_effects: true
  workflow_completion: true
  baseline_comparison: true

reporting:
  format: human
  output: ""
  verbose: true

deployment:
  fail_on_error: true
