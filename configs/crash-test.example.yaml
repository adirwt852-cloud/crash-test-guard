version: "1.0"

agent:
  command: ["go", "run", "./mock-agent/main.go"]
  protocol: http
  endpoint: "http://localhost:8080"
  startup_timeout: "30s"
  shutdown_timeout: "10s"

  # Docker executor (optional) — enable by setting image
  # image: "my-agent:latest"
  # network: "host"
  # volumes:
  #   - "./data:/data"
  # env:
  #   - "DATABASE_URL=postgres://..."

  # Kubernetes executor (optional) — enable by setting namespace/label_selector/pod_name
  # namespace: "production"
  # label_selector: "app=my-agent"
  # pod_name: "my-agent-pod"
  # service_account: "crash-test-guard"
  # kubeconfig: "/path/to/kubeconfig"

crash_scenarios:
  - type: process_kill
    trigger:
      event: step_completed
      step_id: process_payment
      timing: after_event
    fallback:
      timeout: 30s
      on_missed: fail

verification:
  checkpoint_consistency: true
  duplicate_side_effects: true
  workflow_completion: true
  baseline_comparison: true

reporting:
  format: human
  output: ""
  verbose: true

deployment:
  fail_on_error: true